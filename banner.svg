<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">LCHRYU cyber lab profile banner</title>
  <desc id="desc">Animated developer banner with neon HUD panels, terminal code, radar, and skill chips.</desc>

  <style>
    @keyframes gridMove {
      from { transform: translateY(0); }
      to { transform: translateY(28px); }
    }
    @keyframes glow {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, -16px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes scan {
      0% { transform: translateY(-80px); opacity: 0; }
      15%, 85% { opacity: .28; }
      100% { transform: translateY(460px); opacity: 0; }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -280; }
    }
    @keyframes radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes typeIn {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes bar {
      0%, 100% { transform: scaleY(.42); }
      50% { transform: scaleY(1); }
    }

    .grid { animation: gridMove 3.6s linear infinite; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    .float-a { animation: floatA 10s ease-in-out infinite; }
    .float-b { animation: floatB 12s ease-in-out infinite; }
    .scan { animation: scan 4.8s linear infinite; }
    .dash { animation: dash 6s linear infinite; }
    .radar { animation: radar 5s linear infinite; transform-origin: 970px 214px; }
    .cursor { animation: blink 1s steps(2, jump-none) infinite; }
    .line-1 { animation: typeIn .4s ease-out both .2s; }
    .line-2 { animation: typeIn .4s ease-out both .55s; }
    .line-3 { animation: typeIn .4s ease-out both .9s; }
    .line-4 { animation: typeIn .4s ease-out both 1.25s; }
    .line-5 { animation: typeIn .4s ease-out both 1.6s; }
    .bar-1 { animation: bar 1.4s ease-in-out infinite; transform-origin: center bottom; }
    .bar-2 { animation: bar 1.8s ease-in-out infinite .2s; transform-origin: center bottom; }
    .bar-3 { animation: bar 1.2s ease-in-out infinite .4s; transform-origin: center bottom; }
    .bar-4 { animation: bar 1.6s ease-in-out infinite .1s; transform-origin: center bottom; }
    .bar-5 { animation: bar 1.3s ease-in-out infinite .35s; transform-origin: center bottom; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="42%" stop-color="#071426" />
      <stop offset="72%" stop-color="#12051f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cyanPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".65" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".45" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity=".12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="smallGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="1" opacity=".62" />
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)" />
  <g class="grid">
    <rect x="0" y="-28" width="1200" height="476" fill="url(#smallGrid)" opacity=".72" />
  </g>
  <rect width="1200" height="420" rx="24" fill="url(#halo)" />

  <g class="float-a" filter="url(#softGlow)">
    <circle cx="178" cy="88" r="118" fill="#0891b2" opacity=".20" />
    <circle cx="1040" cy="330" r="138" fill="#db2777" opacity=".16" />
  </g>
  <g class="float-b" filter="url(#softGlow)">
    <circle cx="780" cy="82" r="90" fill="#7c3aed" opacity=".16" />
    <circle cx="420" cy="370" r="106" fill="#0ea5e9" opacity=".13" />
  </g>

  <path class="dash" d="M-40 330 H210 L260 282 H525 L574 236 H850 L908 284 H1240" fill="none" stroke="url(#cyanPink)" stroke-width="3" stroke-dasharray="18 18" opacity=".55" />
  <path d="M-40 330 H210 L260 282 H525 L574 236 H850 L908 284 H1240" fill="none" stroke="#22d3ee" stroke-width="10" opacity=".08" filter="url(#softGlow)" />

  <rect class="scan" x="0" y="0" width="1200" height="76" fill="url(#scanGrad)" />

  <g transform="translate(52 44)">
    <rect width="1096" height="332" rx="18" fill="#020617" fill-opacity=".78" stroke="#334155" />
    <rect x="1" y="1" width="1094" height="52" rx="18" fill="#0f172a" fill-opacity=".76" />
    <line x1="0" y1="53" x2="1096" y2="53" stroke="#334155" />
    <circle cx="28" cy="26" r="7" fill="#ef4444" />
    <circle cx="52" cy="26" r="7" fill="#f59e0b" />
    <circle cx="76" cy="26" r="7" fill="#10b981" />
    <text x="548" y="32" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="14" text-anchor="middle">profile://lchryu/cyber-lab</text>
    <circle class="glow" cx="942" cy="26" r="5" fill="#22c55e" />
    <text x="958" y="31" fill="#22c55e" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700">J.A.R.V.I.S ONLINE</text>
  </g>

  <g transform="translate(92 126)">
    <text x="0" y="0" fill="#67e8f9" font-family="Consolas, Monaco, monospace" font-size="16">const developer =</text>
    <text x="0" y="58" fill="url(#cyanPink)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" letter-spacing="2">LCHRYU</text>
    <text x="0" y="95" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Luong Chung Hoi</text>
    <text x="0" y="129" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Full-stack explorer  |  AI / CV learner  |  Game builder</text>

    <g transform="translate(0 160)" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700">
      <rect width="500" height="92" rx="12" fill="#020617" fill-opacity=".72" stroke="#1e293b" />
      <text class="line-1" x="22" y="28"><tspan fill="#f472b6">focus</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#facc15">["web", "mobile", "AI", "games"]</tspan></text>
      <text class="line-2" x="22" y="54"><tspan fill="#38bdf8">status</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#22c55e">"building useful things"</tspan></text>
      <text class="line-3" x="22" y="80"><tspan fill="#a78bfa">motto</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#facc15">"learn deeply, ship clean"</tspan><tspan class="cursor" fill="#67e8f9"> _</tspan></text>
    </g>
  </g>

  <g transform="translate(674 116)">
    <rect width="236" height="224" rx="16" fill="#020617" fill-opacity=".66" stroke="#334155" />
    <text x="22" y="35" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">SYSTEM LOAD</text>
    <g transform="translate(30 70)" fill="url(#cyanPink)">
      <rect class="bar-1" x="0" y="64" width="18" height="82" rx="5" />
      <rect class="bar-2" x="34" y="28" width="18" height="118" rx="5" />
      <rect class="bar-3" x="68" y="52" width="18" height="94" rx="5" />
      <rect class="bar-4" x="102" y="12" width="18" height="134" rx="5" />
      <rect class="bar-5" x="136" y="42" width="18" height="104" rx="5" />
    </g>
    <text x="30" y="197" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="13">WEB AI CV GAME</text>
  </g>

  <g transform="translate(930 118)">
    <rect width="196" height="196" rx="98" fill="#020617" fill-opacity=".60" stroke="#334155" />
    <circle cx="98" cy="98" r="72" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="98" cy="98" r="46" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="98" cy="98" r="8" fill="#22d3ee" filter="url(#softGlow)" />
    <line x1="98" y1="26" x2="98" y2="170" stroke="#1e293b" />
    <line x1="26" y1="98" x2="170" y2="98" stroke="#1e293b" />
    <path class="radar" d="M98 98 L98 30 A68 68 0 0 1 158 68 Z" fill="#22d3ee" opacity=".25" />
    <circle cx="134" cy="72" r="4" fill="#f472b6" class="glow" />
    <circle cx="66" cy="122" r="4" fill="#facc15" class="glow" />
    <text x="98" y="226" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="13" text-anchor="middle">WORLD QUEST: 02/195</text>
  </g>

  <g transform="translate(676 352)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">
    <rect x="0" y="-24" width="72" height="32" rx="16" fill="#082f49" stroke="#0ea5e9" />
    <text x="36" y="-3" fill="#e0f2fe" text-anchor="middle">C++</text>
    <rect x="84" y="-24" width="92" height="32" rx="16" fill="#172554" stroke="#3b82f6" />
    <text x="130" y="-3" fill="#dbeafe" text-anchor="middle">Python</text>
    <rect x="188" y="-24" width="118" height="32" rx="16" fill="#312e81" stroke="#8b5cf6" />
    <text x="247" y="-3" fill="#ede9fe" text-anchor="middle">TypeScript</text>
    <rect x="318" y="-24" width="72" height="32" rx="16" fill="#4a044e" stroke="#d946ef" />
    <text x="354" y="-3" fill="#fae8ff" text-anchor="middle">AI</text>
    <rect x="402" y="-24" width="92" height="32" rx="16" fill="#451a03" stroke="#f59e0b" />
    <text x="448" y="-3" fill="#ffedd5" text-anchor="middle">Games</text>
  </g>
</svg>
