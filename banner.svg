<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- CSS Animations -->
  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    @keyframes float-1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(15px, -10px); }
    }
    @keyframes float-2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-15px, 10px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes type-line-2 {
      0%, 20% { opacity: 0; }
      25%, 100% { opacity: 1; }
    }
    @keyframes type-line-3 {
      0%, 45% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes type-line-4 {
      0%, 70% { opacity: 0; }
      75%, 100% { opacity: 1; }
    }
    @keyframes type-line-5 {
      0%, 90% { opacity: 0; }
      95%, 100% { opacity: 1; }
    }

    .blob-1 { animation: float-1 12s infinite ease-in-out; }
    .blob-2 { animation: float-2 15s infinite ease-in-out; }
    .star-1 { animation: twinkle 3s infinite ease-in-out; }
    .star-2 { animation: twinkle 4.2s infinite ease-in-out; }
    .star-3 { animation: twinkle 2.5s infinite ease-in-out; }
    .star-4 { animation: twinkle 3.5s infinite ease-in-out; }
    .star-5 { animation: twinkle 5s infinite ease-in-out; }
    .pulse-glow { animation: pulse 3s infinite ease-in-out; }
    .pulse-green { animation: statusPulse 1.8s infinite ease-in-out; }
    .cursor { animation: blink 1s infinite; }
    .code-2 { animation: type-line-2 4s ease-out forwards; }
    .code-3 { animation: type-line-3 4s ease-out forwards; }
    .code-4 { animation: type-line-4 4s ease-out forwards; }
    .code-5 { animation: type-line-5 4s ease-out forwards; }
  </style>

  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    
    <!-- Neon Colors -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="300" fill="url(#bgGrad)" rx="16" />
  
  <!-- Sleek Tech Grid Overlay -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.6">
    <!-- Vertical lines -->
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="550" y1="0" x2="550" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="650" y1="0" x2="650" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  <!-- Soft Ambient Light Blobs -->
  <circle class="blob-1" cx="100" cy="80" r="140" fill="#0891b2" opacity="0.12" filter="url(#glowCyan)" />
  <circle class="blob-2" cx="700" cy="220" r="150" fill="#c026d3" opacity="0.1" filter="url(#glowPink)" />
  
  <!-- Glowing Connection Paths -->
  <path d="M -50 240 L 220 240 L 260 200 L 540 200 L 580 240 L 850 240" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" />
  <path d="M -50 240 L 220 240 L 260 200 L 540 200 L 580 240 L 850 240" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.1" filter="url(#glowCyan)" />

  <!-- Glowing Neon Stars Background -->
  <!-- Star 1 -->
  <path class="star-1" d="M 68 85 q 4 0 4 -4 q 0 4 4 4 q -4 0 -4 4 q 0 -4 -4 -4" fill="#06b6d4" opacity="0.75" filter="url(#glowCyan)" />
  <!-- Star 2 -->
  <path class="star-2" d="M 728 95 q 4 0 4 -4 q 0 4 4 4 q -4 0 -4 4 q 0 -4 -4 -4" fill="#d946ef" opacity="0.7" filter="url(#glowPink)" />
  <!-- Star 3 -->
  <path class="star-3" d="M 703 163 q 3 0 3 -3 q 0 3 3 3 q -3 0 -3 3 q 0 -3 -3 -3" fill="#06b6d4" opacity="0.6" filter="url(#glowCyan)" />
  <!-- Star 4 -->
  <path class="star-4" d="M 93 253 q 3 0 3 -3 q 0 3 3 3 q -3 0 -3 3 q 0 -3 -3 -3" fill="#d946ef" opacity="0.5" filter="url(#glowPink)" />
  <!-- Star 5 -->
  <path class="star-5" d="M 500 80 q 3 0 3 -3 q 0 3 3 3 q -3 0 -3 3 q 0 -3 -3 -3" fill="#eab308" opacity="0.75" />

  <!-- IDE Window Frame -->
  <rect x="40" y="40" width="720" height="250" fill="#030712" fill-opacity="0.8" stroke="#1f2937" stroke-width="1.5" rx="12" />
  
  <!-- IDE Control Buttons -->
  <circle cx="65" cy="62" r="6" fill="#ef4444" />
  <circle cx="85" cy="62" r="6" fill="#f59e0b" />
  <circle cx="105" cy="62" r="6" fill="#10b981" />
  <text x="400" y="66" fill="#4b5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" letter-spacing="1">developer-stats.json</text>

  <!-- J.A.R.V.I.S Status Indicator -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5">
    <circle class="pulse-green" cx="645" cy="62" r="4" fill="#10b981" />
    <text x="655" y="66" fill="#10b981">J.A.R.V.I.S : ONLINE</text>
  </g>

  <!-- Profile Text Information -->
  <!-- Name Title with Double Glow -->
  <text x="80" y="135" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" letter-spacing="1">LƯƠNG CHUNG HỘI</text>
  <text class="pulse-glow" x="80" y="135" fill="none" stroke="#22d3ee" stroke-width="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" letter-spacing="1" opacity="0.6" filter="url(#glowCyan)">LƯƠNG CHUNG HỘI</text>

  <!-- Tagline / Role -->
  <text x="80" y="178" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">Hey guys! Welcome to my lab. Let's build something crazy.</text>
  
  <!-- Code Typing Mockup -->
  <g font-family="Consolas, Fira Code, Monaco, 'Courier New', monospace" font-size="14" font-weight="bold">
    <text x="80" y="205">
      <tspan fill="#f43f5e">const</tspan> <tspan fill="#3b82f6">explorer</tspan> = {
    </text>
    <text class="code-2" x="105" y="222">
      <tspan fill="#10b981">research</tspan>: [<tspan fill="#eab308">"AI"</tspan>, <tspan fill="#eab308">"Web-Apps"</tspan>, <tspan fill="#eab308">"Mobile-Apps"</tspan>, <tspan fill="#eab308">"Games"</tspan>],
    </text>
    <text class="code-3" x="105" y="239">
      <tspan fill="#10b981">motto</tspan>: <tspan fill="#eab308">"stay-hungry-stay-foolish"</tspan>,
    </text>
    <text class="code-4" x="105" y="256">
      <tspan fill="#10b981">repos</tspan>: <tspan fill="#eab308">83</tspan>, <tspan fill="#10b981">contributions</tspan>: <tspan fill="#eab308">352</tspan><tspan class="cursor" fill="#06b6d4">|</tspan>
    </text>
    <text class="code-5" x="80" y="273">
      };
    </text>
  </g>
</svg>
