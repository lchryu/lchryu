<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    
    <!-- Neon Colors -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="300" fill="url(#bgGrad)" rx="16" />
  
  <!-- Sleek Tech Grid Overlay -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.6">
    <!-- Vertical lines -->
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="550" y1="0" x2="550" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="650" y1="0" x2="650" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  <!-- Soft Ambient Light Blobs -->
  <circle cx="100" cy="80" r="140" fill="#0891b2" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="700" cy="220" r="150" fill="#c026d3" opacity="0.1" filter="url(#glowPink)" />
  
  <!-- Glowing Connection Paths -->
  <path d="M -50 240 L 220 240 L 260 200 L 540 200 L 580 240 L 850 240" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" />
  <path d="M -50 240 L 220 240 L 260 200 L 540 200 L 580 240 L 850 240" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.1" filter="url(#glowCyan)" />

  <!-- IDE Window Frame -->
  <rect x="40" y="40" width="720" height="220" fill="#030712" fill-opacity="0.8" stroke="#1f2937" stroke-width="1.5" rx="12" />
  
  <!-- IDE Control Buttons -->
  <circle cx="65" cy="62" r="6" fill="#ef4444" />
  <circle cx="85" cy="62" r="6" fill="#f59e0b" />
  <circle cx="105" cy="62" r="6" fill="#10b981" />
  <text x="400" y="66" fill="#4b5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" letter-spacing="1">developer-stats.json</text>

  <!-- Profile Text Information -->
  <!-- Name Title with Double Glow -->
  <text x="80" y="135" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" letter-spacing="1">LƯƠNG CHUNG HỘI</text>
  <text x="80" y="135" fill="none" stroke="#22d3ee" stroke-width="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" letter-spacing="1" opacity="0.6" filter="url(#glowCyan)">LƯƠNG CHUNG HỘI</text>

  <!-- Tagline / Role -->
  <text x="80" y="178" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">Software Engineer / Full-Stack Web Developer</text>
  
  <!-- Code Typing Mockup -->
  <g font-family="Consolas, Fira Code, Monaco, 'Courier New', monospace" font-size="14" font-weight="bold">
    <text x="80" y="220">
      <tspan fill="#f43f5e">const</tspan> <tspan fill="#3b82f6">developer</tspan> = {
    </text>
    <text x="100" y="240">
      <tspan fill="#10b981">skills</tspan>: [<tspan fill="#eab308">"React"</tspan>, <tspan fill="#eab308">"Node.js"</tspan>, <tspan fill="#eab308">"TypeScript"</tspan>, <tspan fill="#eab308">"Tailwind"</tspan>],
      <tspan fill="#10b981">status</tspan>: <tspan fill="#eab308">"building-awesome-things"</tspan>
    </text>
    <text x="80" y="260">
      };
    </text>
  </g>
</svg>
